<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Snake</h1>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
    </header>

    <main class="game">
      <canvas id="board" width="480" height="480" aria-label="Snake game" role="img"></canvas>
    </main>

    <footer class="controls">
      <button id="btn-pause" aria-label="Pause or resume">Pause</button>
      <button id="btn-restart" aria-label="Restart game">Restart</button>
    </footer>

    <div class="dpad" aria-hidden="true">
      <button data-dir="up">▲</button>
      <div class="middle">
        <button data-dir="left">◀</button>
        <button data-dir="right">▶</button>
      </div>
      <button data-dir="down">▼</button>
    </div>
  </div>
  <script src="main.js" defer></script>
</body>
</html>
